name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Config lives in pyproject.toml — same rules locally and in CI.
      - run: ruff check app tests .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (pytest + API smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache HuggingFace models (embedder + cross-encoder)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests + end-to-end API smoke tests
        # tests/conftest.py isolates all data paths into a temp dir and
        # forces a no-cloud LLM backend, so no API keys are needed here.
        # The smoke suite ingests real documents with real embeddings into
        # real (temporary) ChromaDB/BM25/SQLite stores and exercises the
        # duplicate-ingestion guard and the full query pipeline.
        run: pytest tests -v --tb=short
