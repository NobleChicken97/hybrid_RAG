# Pipeline: the only workflow. Lint + secret scan + tests run on every
# push/PR; build/push/deploy run only on pushes to main that touch code
# (docs-only pushes skip the expensive half). One file to track and debug.
#
# CD flow: build backend+web on GH runners, push :<sha> and :latest to ECR,
# SSH into the Lightsail box, fresh ECR login (12h creds), pull the pinned
# :<sha>, restart, gate on public /api/health. Box .env and data/ untouched.
#
# Required GitHub secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY,
# AWS_REGION, ECR_REGISTRY, LIGHTSAIL_HOST, LIGHTSAIL_USER, LIGHTSAIL_SSH_KEY
# (setup + IAM policy in DEPLOY.md "CD via ECR" section).
#
# Rollback: on the box,
#   IMAGE_TAG=<older-sha> docker compose -f deploy/docker-compose.yml up -d

name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run at a time per branch: overlapping deploys race container
# recreation and leave the backend down. Queued, never cancelled.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Config lives in pyproject.toml — same rules locally and in CI.
      - run: ruff check app tests .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (pytest + API smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache HuggingFace models (embedder + cross-encoder)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests + end-to-end API smoke tests
        # tests/conftest.py isolates all data paths into a temp dir and
        # forces a no-cloud LLM backend, so no API keys are needed here.
        run: pytest tests -v --tb=short

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    needs: [lint, secrets, test] # deploy only green, tested code
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'web/**'
              - 'deploy/**'
              - 'requirements.txt'
              - 'run.py'
              - '.github/workflows/pipeline.yml'

  build-push:
    name: Build + push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: ./deploy/Dockerfile
            repo: hybrid-rag-backend
          - service: web
            context: ./web
            dockerfile: ./web/Dockerfile.web
            repo: hybrid-rag-web
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/${{ matrix.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/hybrid-rag && git pull --ff-only
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }} IMAGE_TAG=${{ github.sha }}
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            sleep 45
            curl -sf https://rag.noblechicken.me/api/health | grep -q '"status":"ok"'
            echo "DEPLOY OK: ${{ github.sha }} healthy"
