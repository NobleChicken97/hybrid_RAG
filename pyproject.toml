[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes (unused vars, undefined names)
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear (likely bugs)
    "SIM",             # simplify
    "C4",              # comprehensions
    "RUF",             # ruff-specific
]
ignore = [
    "B008",    # FastAPI: Depends()/File()/Form() in defaults is the framework idiom
    "BLE001",  # broad excepts are intentional at pipeline boundaries (harness reports + continues)
    "PLW0602", # module-level singletons are read via globals() by design
    "ASYNC230", # small file writes in async endpoints; acceptable for this deployment profile
    "RUF059",  # unpacked protocol variables
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export the public API
"__init__.py" = ["F401"]
# Streamlit: st.set_page_config() must run before other imports by design
"frontend/*.py" = ["E402", "I001"]
"frontend/pages/*.py" = ["E402", "I001"]
# Root scripts reconfigure stdout to UTF-8 (Windows console) before imports
"eval_full_run.py" = ["E402"]
"eval_vector_only.py" = ["E402"]
"diagnose_retrieval.py" = ["E402"]
"dedupe_corpus.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
