services:
  backend:
    # CD pulls a pinned ECR image (IMAGE_TAG=<sha>, set by the deploy step;
    # falls back to :latest). Dockerfiles stay in the repo for emergency
    # local builds: `docker build -f deploy/Dockerfile .`
    image: ${ECR_REGISTRY:-local}/hybrid-rag-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env          # keys live here; .env is gitignored, copy to server via scp
    volumes:
      - ../data:/app/data      # ChromaDB + BM25 + SQLite persist on the host
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Next.js frontend (primary UI since the 2026-09-04 cutover). Browsers hit
  # it through Caddy; API calls use the relative /api/* prefix, which Caddy
  # strips and proxies to the backend. NEXT_PUBLIC_BACKEND_URL stays UNSET
  # in this image so the client uses that same-origin path.
  web:
    image: ${ECR_REGISTRY:-local}/hybrid-rag-web:${IMAGE_TAG:-latest}
    pull_policy: always
    expose:
      - "3000"
    healthcheck:
      # node:22-slim ships no curl/wget — use node's built-in fetch.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"   # only used once a DOMAIN is set (automatic HTTPS)
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
