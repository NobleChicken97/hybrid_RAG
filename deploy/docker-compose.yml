services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env          # keys live here; .env is gitignored, copy to server via scp
    volumes:
      - ../data:/app/data      # ChromaDB + BM25 + SQLite persist on the host
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  streamlit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: >
      streamlit run frontend/app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      BACKEND_URL: http://backend:8000   # server-side calls go over the compose network
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8501"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"   # only used once a DOMAIN is set (automatic HTTPS)
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - streamlit
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
